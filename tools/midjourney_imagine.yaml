identity:
  name: midjourney_imagine
  author: acedatacloud
  label:
    en_US: Midjourney Imagine
    zh_Hans: Midjourney 文生图/变换
description:
  human:
    en_US: Generate or transform images via Ace Data Cloud Midjourney Imagine API.
    zh_Hans: 通过 Ace Data Cloud Midjourney Imagine API 进行文生图与图片变换。
  llm: Generate or transform an image with Midjourney Imagine API. Generation returns
    a task ID. Query the same task until complete; never resubmit a pending generation.
parameters:
- name: mask
  type: string
  required: false
  label:
    en_US: Mask URL
    zh_Hans: 蒙版链接
  human_description:
    en_US: Optional mask image URL for variation_region action.
    zh_Hans: 可选蒙版图片链接，用于 variation_region 操作。
  llm_description: Optional mask image URL for variation_region action.
  form: form
- name: mode
  type: select
  required: false
  label:
    en_US: Mode
    zh_Hans: 模式
  human_description:
    en_US: Generation mode.
    zh_Hans: 生成模式。
  llm_description: Generation mode.
  form: form
  default: fast
  options:
  - value: fast
    label:
      en_US: fast
      zh_Hans: fast
  - value: relax
    label:
      en_US: relax
      zh_Hans: relax
  - value: turbo
    label:
      en_US: turbo
      zh_Hans: turbo
- name: action
  type: string
  required: false
  label:
    en_US: Action
    zh_Hans: 操作
  human_description:
    en_US: Operation action. Default is generate; e.g. upscale1/variation2/zoom_out_2x.
    zh_Hans: 操作类型，默认 generate，也可填 upscale1/variation2/zoom_out_2x 等。
  llm_description: Operation action. Default is generate; e.g. upscale1/variation2/zoom_out_2x.
  form: form
  default: generate
- name: prompt
  type: string
  required: false
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Text prompt used to generate the image (required when action=generate).
    zh_Hans: 生成图片的提示词（action=generate 时必填）。
  llm_description: Text prompt used to generate the image (required when action=generate).
  form: llm
- name: image_id
  type: string
  required: false
  label:
    en_US: Image ID
    zh_Hans: 图片ID
  human_description:
    en_US: Required when action is not generate.
    zh_Hans: action 非 generate 时必填。
  llm_description: Required when action is not generate.
  form: form
- name: translation
  type: boolean
  required: false
  label:
    en_US: Auto translate
    zh_Hans: 自动翻译
  human_description:
    en_US: Auto translate non-English prompt.
    zh_Hans: 自动翻译非英文提示词。
  llm_description: Auto translate non-English prompt.
  form: form
  default: false
- name: split_images
  type: boolean
  required: false
  label:
    en_US: Split 2x2
    zh_Hans: 拆分2x2
  human_description:
    en_US: Split a 2x2 grid into single images when supported.
    zh_Hans: 将 2x2 预览图拆分为单张（如支持）。
  llm_description: Split a 2x2 grid into single images when supported.
  form: form
  default: false
- name: version
  type: select
  required: false
  label:
    en_US: Version
    zh_Hans: 版本
  human_description:
    en_US: Midjourney model version. V8 is the latest with HD and quality 4 support.
    zh_Hans: Midjourney 模型版本。V8 为最新版本，支持 HD 和 quality 4。
  llm_description: Midjourney model version. V8 is the latest with HD and quality
    4 support.
  form: form
  default: '8.2'
  options:
  - value: '8.2'
    label:
      en_US: '8.2'
      zh_Hans: '8.2'
  - value: '8.1'
    label:
      en_US: '8.1'
      zh_Hans: '8.1'
  - value: '8'
    label:
      en_US: '8'
      zh_Hans: '8'
  - value: '7'
    label:
      en_US: '7'
      zh_Hans: '7'
  - value: '6.1'
    label:
      en_US: '6.1'
      zh_Hans: '6.1'
  - value: '6'
    label:
      en_US: '6'
      zh_Hans: '6'
  - value: '5.2'
    label:
      en_US: '5.2'
      zh_Hans: '5.2'
- name: hd
  type: boolean
  required: false
  label:
    en_US: HD Mode
    zh_Hans: HD 高清
  human_description:
    en_US: Enable HD mode for 2K resolution output (V8 only, costs 4x).
    zh_Hans: 启用 HD 高清模式输出 2K 分辨率图像（仅 V8，消耗 4 倍积分）。
  llm_description: Enable HD mode for 2K resolution output (V8 only, costs 4x).
  form: form
  default: false
- name: quality
  type: string
  required: false
  label:
    en_US: Quality
    zh_Hans: 画质
  human_description:
    en_US: Image quality level.
    zh_Hans: 图像画质等级。
  llm_description: Image quality level.
  form: form
  default: '1'
- name: style_reference
  type: boolean
  required: false
  label:
    en_US: Style Reference
    zh_Hans: 风格参考
  human_description:
    en_US: Whether the prompt uses --sref style references (V8 premium feature).
    zh_Hans: 提示词是否使用了 --sref 风格参考（V8 高级特性）。
  llm_description: Whether the prompt uses --sref style references (V8 premium feature).
  form: form
  default: false
- name: moodboard
  type: boolean
  required: false
  label:
    en_US: Moodboard
    zh_Hans: 情绪板
  human_description:
    en_US: Whether using moodboard mode with multiple reference images (V8 premium
      feature).
    zh_Hans: 是否使用多参考图的情绪板模式（V8 高级特性）。
  llm_description: Whether using moodboard mode with multiple reference images (V8
    premium feature).
  form: form
  default: false
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/midjourney_imagine.py
