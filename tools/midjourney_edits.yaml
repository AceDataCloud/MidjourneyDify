identity:
  name: midjourney_edits
  author: acedatacloud
  label:
    en_US: Midjourney Edits
    zh_Hans: Midjourney 图片编辑
description:
  human:
    en_US: Edit an image via Ace Data Cloud Midjourney Edits API.
    zh_Hans: 通过 Ace Data Cloud Midjourney Edits API 编辑图片生成。
  llm: Edit an image with a prompt and an image_url via Midjourney Edits API. Generation
    returns a task ID. Query the same task until complete; never resubmit a pending
    generation.
parameters:
- name: mask
  type: string
  required: false
  label:
    en_US: Mask
    zh_Hans: 蒙版
  human_description:
    en_US: Optional mask for targeted edits.
    zh_Hans: 可选蒙版，用于指定编辑区域。
  llm_description: Optional mask for targeted edits.
  form: form
- name: mode
  type: select
  required: false
  label:
    en_US: Mode
    zh_Hans: 模式
  human_description:
    en_US: Generation mode.
    zh_Hans: 生成模式。
  llm_description: Generation mode.
  form: form
  default: fast
  options:
  - value: fast
    label:
      en_US: fast
      zh_Hans: fast
  - value: relax
    label:
      en_US: relax
      zh_Hans: relax
  - value: turbo
    label:
      en_US: turbo
      zh_Hans: turbo
- name: action
  type: string
  required: false
  label:
    en_US: Action
    zh_Hans: 操作
  human_description:
    en_US: Edit action, default is generate.
    zh_Hans: 编辑行为，默认 generate。
  llm_description: Edit action, default is generate.
  form: form
  default: generate
- name: prompt
  type: string
  required: false
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Text prompt used to edit the image.
    zh_Hans: 用于编辑图片的提示词。
  llm_description: Text prompt used to edit the image.
  form: llm
- name: image_url
  type: string
  required: false
  label:
    en_US: Image URL
    zh_Hans: 图片URL
  human_description:
    en_US: Input image URL to edit.
    zh_Hans: 需要编辑的图片链接。
  llm_description: Input image URL to edit.
  form: form
- name: split_images
  type: boolean
  required: false
  label:
    en_US: Split images
    zh_Hans: 拆分图片
  human_description:
    en_US: Return sub_image_urls when supported.
    zh_Hans: 返回 sub_image_urls（如支持）。
  llm_description: Return sub_image_urls when supported.
  form: form
  default: false
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/midjourney_edits.py
